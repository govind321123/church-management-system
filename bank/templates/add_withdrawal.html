{% extends 'index.html' %}

{% block content %}

<div class="container-fluid py-4">

    <div class="custom-card p-4 shadow-sm rounded">

        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="mb-0">
                Add Withdrawal
            </h3>

            <!-- Back Button -->
            <a href="javascript:history.back()"
               class="btn btn-secondary">

                ← Back

            </a>

        </div>

        <!-- Withdrawal Form -->
        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="mt-3">

                <button type="submit"
                        class="btn btn-danger">

                    Save Withdrawal

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
