{% extends 'index.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-header bg-primary text-white rounded-top-4 p-4">
            <h3 class="mb-0">
                Add Expenditure
            </h3>
        </div>

        <div class="card-body p-4">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Date
                        </label>

                        {{ form.date }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Category
                        </label>

                        {{ form.category }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Amount
                        </label>

                        {{ form.amount }}
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Approved By
                        </label>

                        {{ form.approved_by }}
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">
                            Description
                        </label>

                        {{ form.description }}
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">
                            Payment Mode
                        </label>

                        {{ form.payment_mode }}
                    </div>

                </div>

                <button type="submit" class="btn btn-success px-4">
                    Save Expenditure
                </button>

                <a href="{% url 'expenditure_list' %}"
                   class="btn btn-secondary px-4">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
