{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Household Report</title>

    <!-- Bootstrap -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="{% static 'assets/css/custom.css' %}">

    <style>

        body {

            font-family: Arial;
            background: #f4f6f9;

        }

        .container {

            width: 900px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;

        }

        table {

            width: 100%;

        }

        @media print {

            .btn,
            .no-print {

                display: none !important;

            }

            body {

                background: white;

            }

            .container {

                box-shadow: none;
                width: 100%;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="d-flex align-items-center gap-3">

            <!-- BACK BUTTON -->

            <a href="javascript:history.back()"
               class="btn btn-secondary shadow no-print">

                <i class="bi bi-arrow-left"></i>
                Back

            </a>

            <!-- TITLE -->

            <h2 class="mb-0 fw-bold">
                Household Report
            </h2>

        </div>

    </div>

    <!-- REPORT EXPORT BUTTONS -->

    <div class="d-flex gap-2 mb-4 no-print justify-content-center">

        <!-- PDF -->

        <button onclick="downloadPDF()"
                class="btn btn-danger">

            Export PDF

        </button>

        <!-- EXCEL -->

        <button onclick="exportTableToExcel('reportTable', 'household_report')"
                class="btn btn-success">

            Export Excel

        </button>

        <!-- PRINT -->

        <button onclick="printReport()"
                class="btn btn-dark">

            Print

        </button>

    </div>

    <!-- REPORT TABLE -->

    <div class="table-responsive">

        <table class="table table-bordered table-striped"
               id="reportTable">

            <thead class="table-dark">

                <tr>

                    <th>Section</th>
                    <th>Details</th>

                </tr>

            </thead>

            <tbody>

                <!-- TOTAL -->

                <tr>

                    <td>
                        Total Households
                    </td>

                    <td>
                        {{ total }}
                    </td>

                </tr>

                <!-- LOCALITY COUNTS -->

                {% for loc in locality_counts %}

                <tr>

                    <td>
                        {{ loc.locality }}
                    </td>

                    <td>
                        {{ loc.count }} Households
                    </td>

                </tr>

                {% endfor %}

                <!-- HOUSE NUMBERS -->

                {% for locality, houses in locality_houses.items %}

                <tr>

                    <td>
                        {{ locality }}
                    </td>

                    <td>
                        {{ houses|join:", " }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

<!-- XLSX LIBRARY -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- PDF LIBRARIES -->

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable"></script>

<!-- EXCEL EXPORT -->

<script>

function exportTableToExcel(tableID, filename = '') {

    let table = document.getElementById(tableID);

    let workbook = XLSX.utils.table_to_book(table, {

        sheet: "Household Report"

    });

    filename = filename ? filename + ".xlsx" : "report.xlsx";

    XLSX.writeFile(workbook, filename);

}

</script>

<!-- PDF DOWNLOAD -->

<script>

async function downloadPDF() {

    const { jsPDF } = window.jspdf;

    let doc = new jsPDF();

    doc.setFontSize(18);

    doc.text("Household Report", 14, 20);

    doc.autoTable({

        html: '#reportTable',

        startY: 30,

        theme: 'grid',

        headStyles: {

            fillColor: [52, 58, 64]

        },

        styles: {

            fontSize: 10

        }

    });

    doc.save("household_report.pdf");

}

</script>

<!-- PRINT REPORT -->

<script>

function printReport() {

    let tableContent =
        document.getElementById("reportTable").outerHTML;

    let printWindow =
        window.open('', '', 'width=900,height=700');

    printWindow.document.write(`

        <html>

        <head>

            <title>Print Report</title>

            <style>

                body{
                    font-family: Arial;
                    padding:20px;
                }

                table{
                    width:100%;
                    border-collapse: collapse;
                }

                th, td{
                    border:1px solid #000;
                    padding:8px;
                    text-align:left;
                }

                th{
                    background:#343A40;
                    color:white;
                }

            </style>

        </head>

        <body>

            <h2>Household Report</h2>

            ${tableContent}

        </body>

        </html>

    `);

    printWindow.document.close();

    printWindow.print();

}

</script>

</body>

</html>
