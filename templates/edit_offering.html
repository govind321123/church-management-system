{% extends 'index.html' %}

{% block content %}

<div class="main-content">

    <div class="custom-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="fw-bold">
                Edit Offering
            </h3>

            <a href="{% url 'offering_list' %}"
               class="btn btn-dark">

                <i class="bi bi-arrow-left"></i>
                Back

            </a>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <!-- CATEGORY -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Offering Category
                    </label>

                    <select name="category"
                            class="form-select"
                            required>

                        {% for category in categories %}

                        <option value="{{ category.id }}"

                            {% if offering.category.id == category.id %}
                                selected
                            {% endif %}>

                            {{ category.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- AMOUNT -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Amount
                    </label>

                    <input type="number"
                           step="0.01"
                           name="amount"
                           value="{{ offering.amount }}"
                           class="form-control"
                           required>

                </div>



                <!-- GIVEN BY -->

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Given By
                        </label>

                        <input type="text"
                            name="given_by"
                            value="{{ offering.given_by }}"
                            class="form-control"
                            placeholder="Optional donor name">

                    </div>

                <!-- PAYMENT METHOD -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Payment Method
                    </label>

                    <select name="payment_method"
                            class="form-select"
                            required>

                        <option value="Cash"

                            {% if offering.payment_method == 'Cash' %}
                                selected
                            {% endif %}>

                            Cash

                        </option>

                        <option value="UPI"

                            {% if offering.payment_method == 'UPI' %}
                                selected
                            {% endif %}>

                            UPI

                        </option>

                        <option value="Bank"

                            {% if offering.payment_method == 'Bank' %}
                                selected
                            {% endif %}>

                            Bank

                        </option>

                    </select>

                </div>

                <!-- SERVICE DATE -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Service Date
                    </label>

                    <input type="date"
                           name="service_date"
                           value="{{ offering.service_date|date:'Y-m-d' }}"
                           class="form-control"
                           required>

                </div>

                <!-- REMARKS -->

                <div class="col-12 mb-4">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea name="remarks"
                              rows="4"
                              class="form-control"
                              placeholder="Optional remarks">{{ offering.remarks }}</textarea>

                </div>

            </div>

            <!-- BUTTONS -->

            <div class="d-flex gap-2">

                <button type="submit"
                        class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>
                    Update Offering

                </button>

                <a href="{% url 'offering_list' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
